%YAML 1.2
---
$id: http://devicetree.org/schemas/mtd/allwinner,sun4i-a10-nand.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Allwinner A10 NAND Controller

maintainers:
  - Chen-Yu Tsai <wens@csie.org>
  - Maxime Ripard <mripard@kernel.org>

properties:
  compatible:
    enum:
      - allwinner,sun4i-a10-nand
      - allwinner,sun8i-a23-nand-controller
      - allwinner,sun50i-h616-nand-controller

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    minItems: 2
    items:
      - description: Bus Clock
      - description: Module Clock
      - description: ECC Clock
      - description: MBus Clock

  clock-names:
    minItems: 2
    items:
      - const: ahb
      - const: mod
      - const: ecc
      - const: mbus

  resets:
    maxItems: 1

  reset-names:
    const: ahb

  dmas:
    maxItems: 1

  dma-names:
    const: rxtx

patternProperties:
  "^nand@[a-f0-9]$":
    type: object
    $ref: raw-nand-chip.yaml
    properties:
      reg:
        minimum: 0
        maximum: 7

      nand-ecc-algo:
        const: bch

      nand-ecc-step-size:
        enum: [ 512, 1024 ]

      nand-ecc-strength:
        maximum: 80

      allwinner,rb:
        description:
          Contains the native Ready/Busy IDs.
        $ref: /schemas/types.yaml#/definitions/uint32-array
        minItems: 1
        maxItems: 2
        items:
          minimum: 0
          maximum: 1

      allwinner,randomized-oob:
        type: boolean
        description:
          Select the normal-page format used by Allwinner NAND firmware for
          the configured controller hardware-ECC geometry. Normal page
          transfers use the controller randomizer, the bad block marker remains
          in its data stream instead of being compensated to stay plain on
          flash, and protected user data uses the controller-specific placement
          expected by the firmware.

    unevaluatedProperties: false

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names

unevaluatedProperties: false

allOf:
  - $ref: nand-controller.yaml

  - if:
      properties:
        compatible:
          contains:
            enum:
              - allwinner,sun4i-a10-nand
              - allwinner,sun8i-a23-nand-controller
    then:
      properties:
        clocks:
          maxItems: 2
        clock-names:
          maxItems: 2
      patternProperties:
        "^nand@[a-f0-9]$":
          properties:
            partitions:
              patternProperties:
                "@[0-9a-f]+$":
                  properties:
                    allwinner,boot-format: false

  - if:
      properties:
        compatible:
          contains:
            enum:
              - allwinner,sun50i-h616-nand-controller
    then:
      properties:
        clocks:
          minItems: 4
        clock-names:
          minItems: 4
      required:
        - resets
        - reset-names

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/sun50i-h616-ccu.h>
    #include <dt-bindings/reset/sun50i-h616-ccu.h>

    nand-controller@4011000 {
        compatible = "allwinner,sun50i-h616-nand-controller";
        reg = <0x04011000 0x1000>;
        interrupts = <GIC_SPI 34 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&ccu CLK_BUS_NAND>, <&ccu CLK_NAND0>,
                 <&ccu CLK_NAND1>, <&ccu CLK_MBUS_NAND>;
        clock-names = "ahb", "mod", "ecc", "mbus";
        resets = <&ccu RST_BUS_NAND>;
        reset-names = "ahb";
        #address-cells = <1>;
        #size-cells = <0>;

        nand@0 {
            reg = <0>;
            allwinner,rb = <0>;
            nand-bus-width = <8>;
            nand-ecc-step-size = <1024>;
            nand-ecc-strength = <32>;

            partitions {
                compatible = "fixed-partitions";
                #address-cells = <1>;
                #size-cells = <1>;

                partition@0 {
                    allwinner,boot-format;
                    reg = <0x0 0x40000>;
                    label = "spl";
                };

                partition@80000 {
                    allwinner,boot-format;
                    reg = <0x80000 0x40000>;
                    label = "spl-backup";
                };

                partition@100000 {
                    reg = <0x100000 0x400000>;
                    label = "uboot";
                };
            };
        };
    };

...
